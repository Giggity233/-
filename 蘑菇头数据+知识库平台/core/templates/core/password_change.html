{% extends "base.html" %}
{% block page_title %}修改密码{% endblock %}
{% block content %}<div class="page-heading"><div><h1>修改密码</h1><p>密码修改后需使用新密码重新登录。</p></div></div><section class="panel form-panel narrow"><form method="post" class="styled-form">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<em>{{ error }}</em>{% endfor %}</label>{% endfor %}<button class="btn btn-primary">更新密码</button></form></section>{% endblock %}
