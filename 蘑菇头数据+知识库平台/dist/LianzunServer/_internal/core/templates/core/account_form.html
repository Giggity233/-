{% extends "base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}<div class="page-heading"><div><h1>{{ title }}</h1><p>账号密码只归属于店铺账号，不归属于店铺本身。</p></div></div><section class="panel form-panel"><form method="post" class="styled-form">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<em>{{ error }}</em>{% endfor %}</label>{% endfor %}<div class="form-actions"><button class="btn btn-primary">保存</button><a class="btn btn-secondary" href="{% url 'account_center' %}">取消</a></div></form></section>{% endblock %}
