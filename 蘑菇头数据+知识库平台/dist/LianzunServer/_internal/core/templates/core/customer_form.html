{% extends "base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}<div class="page-heading"><div><h1>{{ title }}</h1><p>客户禁用后不可再被认领，但原有数据会保留。客户登录账号由管理员在“客户账号管理”中单独创建。</p></div></div><section class="panel form-panel"><form method="post" class="styled-form">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<em>{{ error }}</em>{% endfor %}</label>{% endfor %}<fieldset class="customer-access-fields"><legend>客户登录权限</legend><label class="knowledge-check"><input type="checkbox" name="allow_store_knowledge_view" {% if customer.allow_store_knowledge_view %}checked{% endif %}> 允许查看本客户店铺知识库</label><label class="knowledge-check"><input type="checkbox" name="allow_product_knowledge_view" {% if customer.allow_product_knowledge_view %}checked{% endif %}> 允许查看本客户商品知识库</label><strong>店铺数据中心可见字段</strong><div class="checks">{% for key,label in column_options %}<label><input type="checkbox" name="visible_fields" value="{{ key }}" {% if key in visible_fields %}checked{% endif %}> {{ label }}</label>{% endfor %}</div></fieldset><div class="form-actions"><button class="btn btn-primary">保存</button><a class="btn btn-secondary" href="{% url 'customer_list' %}">取消</a></div></form></section>{% endblock %}
