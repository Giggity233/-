<th class="sortable-column"><span class="sort-header-group"><a class="sort-header-link" data-store-data-link data-store-data-sort-toggle="{{ key }}" href="?{% if sort_query %}{{ sort_query }}&amp;{% endif %}sort={{ key }}&amp;direction={% if current_sort == key and sort_direction == 'asc' %}desc{% else %}asc{% endif %}" title="点击切换排序方向">{{ label }}</a>{% if tooltip %}<span class="header-tooltip" tabindex="0" data-tooltip="{{ tooltip }}" title="{{ tooltip }}" aria-label="{{ tooltip }}">?</span>{% endif %}</span><span class="sort-controls" aria-label="{{ label }}排序"><a class="sort-link {% if current_sort == key and sort_direction == 'asc' %}active{% endif %}" data-store-data-link data-store-data-sort="{{ key }}" data-store-data-direction="asc" href="?{% if sort_query %}{{ sort_query }}&amp;{% endif %}sort={{ key }}&amp;direction=asc" aria-label="按{{ label }}从小到大排序" title="从小到大排序">▲</a><a class="sort-link {% if current_sort == key and sort_direction == 'desc' %}active{% endif %}" data-store-data-link data-store-data-sort="{{ key }}" data-store-data-direction="desc" href="?{% if sort_query %}{{ sort_query }}&amp;{% endif %}sort={{ key }}&amp;direction=desc" aria-label="按{{ label }}从大到小排序" title="从大到小排序">▼</a></span></th>
